# ---------------------------------------------------------------- Hermitcraft Seasons 7-9

# Rosters from the Hermitcraft wiki. The patterns allow "vanilla/server/smp"-style words and roman numerals
# before the number ("Hermitcraft VII", "HermitCraft8"); `skip` leaves out the modded and minigame series that
# reuse the name (FTB, UHC, HermitPack...).

# Opened 5 Mar 2022. TinfoilChef died on 13 Aug 2022, mid-season. Empires/event cameos left out.
[[collection]]
name = "Season 9"
series = "Hermitcraft"
playlist = 'hermit\s*craft[\s:|!~\[\(\-]*(?:(?:vanilla|amplified|survival(?:\s*lp)?|(?:minecraft\s*)?server|smp)!?[\s:|!~\[\(\-]*)*(?:seasons?\s*|series\s*|s)?(9|ix)\b'
video_title = 'hermit\s*craft[\s:|!~\[\(\-]*(?:(?:vanilla|amplified|survival(?:\s*lp)?|(?:minecraft\s*)?server|smp)!?[\s:|!~\[\(\-]*)*(?:seasons?\s*|series\s*|s)?(9|ix)\b'
skip = 'stream|shorts|\blive\b|\bftb\b|feed\s*the\s*beast|mod\s*sauce|\buhc\b|ultra\s*hardcore|battle\s*royale|tekkit|hermit\s*pack|gamemode\s*4|\bgm4\b'
starts = "2022-03-01"
ends = "2023-04-05"
members = ["BdoubleO100", "Cubfan135", "Docm77", "Etho", "FalseSymmetry", "GeminiTay", "GoodTimesWithScar", "Grian",
           "Hypnotizd", "iJevin", "impulseSV", "Iskall85", "Joe Hills", "Keralis", "Mumbo Jumbo", "PearlescentMoon",
