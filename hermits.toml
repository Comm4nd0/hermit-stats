# Hermitcraft Seasons 1-9: rosters from the Hermitcraft fandom wiki (season pages, "Hermits" section),
# channels checked with youtube.channel_playlists on 2026-10-21.
#
# Playlist names on old seasons are all over the place ("HermitCraft!", "Hermitcraft 2.0", "Hermitcraft II",
# "HermitCraft Survival LP [SERIES 2]", "Minecraft HermitCraft Amplified Server Season 3", "HermitCraft8", ...).
# The regexes allow optional "vanilla/amplified/survival lp/server/smp" words before an optional
# "season/series/s" and the number (arabic or roman; \b keeps 1 from matching 10/11). Season 1 also takes a
# bare "Hermitcraft"/"HermitCraft!"/"The HermitCraft Server!" playlist, since nobody numbered Season 1 at the time;
# its video_title is any "hermitcraft" title not marked as Season 2, bounded by the date window.
# `skip` adds the modded/minigame series that reuse the name (FTB, ModSauce, UHC, HermitPack, Battle Royale, GM4).

# Opened 13 Apr 2012 (reset twice in the first two weeks). CilantroGamer, Dinnerbone and Marc IRL only streamed;
# Brenybeast and Sokar joined but never posted. Cameos (SethBling, BlockFortress, Toby, Invis...) left out.
[[collection]]
name = "Season 1"
paused = true
series = "Hermitcraft"
playlist = 'hermit\s*craft[\s:|!~\[\(\-]*(?:(?:vanilla|amplified|survival(?:\s*lp)?|(?:minecraft\s*)?server|smp)!?[\s:|!~\[\(\-]*)*(?:seasons?\s*|series\s*|s)?(1)\b|^\W*(?:minecraft\W*|the\s+|\w+:\s*)?hermit\s*craft(?:\W*(?:server|vanilla|smp|survival|the\s+original\s+series|with\s+joe\s+hills|red3yz))*\W*$'
video_title = 'hermit\s*craft(?![\s:|!~\[\(\-]*(?:(?:vanilla|amplified|survival(?:\s*lp)?|(?:minecraft\s*)?server|smp)!?[\s:|!~\[\(\-]*)*(?:2\.0|ii\b|seasons?\s*2\b|series\s*2\b|s2\b))'
skip = 'stream|shorts|\blive\b|\bvod\b|empires|seed.*speed\s*run|speed\s*run.*seed|nutshell|memory\s*lane|best\s*bits|\bbest\s+of\b|coffee|moby\s*dick|good\s*morning'
starts = "2012-04-08"
ends = "2013-07-07"
members = ["777static777", "Aureylian", "BdoubleO100", "Biffa2001", "BrenyBeast", "CilantroGamer", "Coestar",
           "Cubehamster", "Dinnerbone", "Generikb", "Hypnotizd", "IAmSp00n", "Jessassin", "Joe Hills", "Juicetra",
           "Keralis", "Kiershar", "KingDaddyDMAC", "Marc IRL", "Monkeyfarm", "Pungence", "Red3yz", "Shawnvmartin",
           "Skyzm", "Sokar", "ThePixelNerds", "TopMass", "Unhost", "Xisumavoid"]
