# hermit-stats configuration.
#
# [[collection]]  a group of videos analysed together (a season, a series). Each Hermit's videos are
#                 found from their channel's playlists whose title matches `playlist`; if a channel has
#                 no matching playlist, their uploads whose title matches `video_title` are used instead.
#                 Both are case-insensitive regular expressions. Playlists / titles matching `skip` (livestreams,
#                 shorts) are left out, and so is anything uploaded before `starts`. `teams` (optional) names
#                 groups of Hermits that can be selected together: { "Team" = ["Hermit name", ...] }.
#                 `members` (optional) limits whose channels are searched; without it, every Hermit not `only_listed`.
#                 `ends` drops later uploads, like `starts` earlier ones. `series` (default "Hermitcraft") groups
#                 collections in the season picker; other series call their people players, not Hermits.
#
# [[hermit]]      one YouTube channel; `short` is the name used on charts. `aliases` are what other Hermits call them on camera (plus common
#                 auto-caption mishearings); a spoken alias in someone else's video counts as a mention.
#                 `exclude` lists phrases that contain an alias but aren't about the Hermit
#                 ("ender pearl" is not Pearl). `playlists` adds playlists by hand: { "Season 11" = "PL..." }.
#                 `only_listed = true` for a former Hermit or a Life Series player: their channel is only searched
#                 for the collections whose `members` name them.

# Channels that reupload old episodes: a video from one of these, found in a hermit's playlist,
# still counts as that hermit's.
archive_channels = ["@TheHermitcraftArchive"]

[deploy]
target = "luma:/root/caddy/static/hermit-stats/"
url = "https://hermit-stats.com"
[[collection]]
name = "Season 11"
playlist = 'hermit\s*craft[\s:|-]*(season\s*|s)?(11|xi)\b'
video_title = 'hermit\s*craft[\s:|-]*(season\s*|s)?(11|xi)\b'
skip = 'stream|shorts|\blive\b'
starts = "2025-11-01"

[collection.teams]
"C-Team" = ["Mumbo Jumbo", "Rendog", "Skizzleman", "VintageBeef"]
"EGGZ" = ["Etho", "GeminiTay", "Grian", "ZombieCleo"]
"Fire Department" = ["PearlescentMoon", "impulseSV", "Mumbo Jumbo", "FalseSymmetry", "Joe Hills"]
"Frenemies" = ["SmallishBeans", "BdoubleO100", "Docm77", "GoodTimesWithScar"]
"ZITS" = ["Zedaph", "impulseSV", "Tango Tek", "Skizzleman"]
